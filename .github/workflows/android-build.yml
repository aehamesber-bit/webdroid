name: Build Android APK

on:
  push:
    branches: [main, "kilo/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            platform-tools
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate Gradle configuration
        run: gradle help --no-daemon

      - name: Run Kotlin unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Run shell client tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null 2>&1
          bash tests/shell/test_client.sh

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Generate CI release test keystore
        run: |
          keytool -genkeypair \
            -alias webdroid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore release-keystore.jks \
            -storepass android \
            -keypass android \
            -dname "CN=WebDroid Test,O=WebDroid,C=US"

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon \
            -PRELEASE_STORE_PASSWORD=android \
            -PRELEASE_KEY_PASSWORD=android

      - name: Verify APK package, SDK range, ABI independence, and signatures
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "=== $apk ==="
            test -s "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | tee "${apk}.badging.txt"
            grep -F "package: name='io.github.takafu.webdroid'" "${apk}.badging.txt"
            grep -F "sdkVersion:'24'" "${apk}.badging.txt"
            grep -F "targetSdkVersion:'34'" "${apk}.badging.txt"
            if unzip -l "$apk" | grep -E 'lib/[^ ]+\.so$'; then
              echo "Native libraries present; inspect ABI coverage above."
            else
              echo "No native libraries: app is ABI-independent Java/Kotlin."
            fi
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk"
          done

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdroid-galaxy-a10-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdroid-galaxy-a10-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
